<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121215" />
    <!--
      Apply the stored theme before first paint (design audit m-4, 2026-10-28).
      The app keeps its preference in localStorage and toggles `.dark` on
      <html>; doing it here means a light-mode user never sees a dark splash
      that snaps to light once React mounts. Mirrors the initial state in
      src/context/AppContext.tsx (same key, same JSON boolean).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('omninote_dark_mode_v1');
          var dark =
            saved === null
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : JSON.parse(saved) === true;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#121215' : '#fafaf9');
        } catch (e) {
          /* storage or JSON unavailable: fall back to the light default */
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https: ws: wss: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>VellumScribe</title>
    <meta
      name="description"
      content="Unique offline-first multimodal note-taking studio with interactive checklists, sketch canvas, voice transcripts, OCR extraction, version history, and intelligent Gemini AI summaries powered by your free Google AI Studio key."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta property="og:title" content="VellumScribe" />
    <meta
      property="og:description"
      content="Unique offline-first multimodal note-taking studio with interactive checklists, sketch canvas, voice transcripts, OCR extraction, version history, and intelligent Gemini AI summaries powered by your free Google AI Studio key."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VellumScribe — Minimalist Multimodal Notes Studio" />
    <meta
      name="twitter:description"
      content="Offline-first multimodal note-taking studio with interactive checklists, drawing canvas, voice transcriptions, OCR document scans, PIN security, and cloud sync."
    />
    <!--
      First-paint loader theming (design audit m-4): the splash follows the
      stored theme, so a light-mode launch never flashes a dark screen.
    -->
    <style>
      html,
      body {
        background: #fafaf9;
        color: #18181b;
      }
      html.dark,
      html.dark body {
        background: #121215;
        color: #f4f4f5;
      }
      #vellumscribe-init-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fafaf9;
        color: #18181b;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: -0.011em;
        z-index: 99999;
      }
      html.dark #vellumscribe-init-loader {
        background: #121215;
        color: #f4f4f5;
      }
      .vs-loader-mark {
        display: block;
        margin-bottom: 18px;
      }
      .vs-loader-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .vs-loader-subtitle {
        font-size: 13px;
        color: #52525b;
        letter-spacing: -0.01em;
      }
      html.dark .vs-loader-subtitle {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash while SQLite WASM & Keystore initialise. The mark is
           the canonical /favicon.svg (generated from assets/brand by
           `npm run assets:brand`), so the geometry lives in one place
           (design audit m-1). -->
      <div id="vellumscribe-init-loader">
        <img class="vs-loader-mark" src="/favicon.svg" width="52" height="52" alt="" />
        <div class="vs-loader-title">VellumScribe</div>
        <div class="vs-loader-subtitle">Loading your notes…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
