<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121215" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https: ws: wss: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>VellumScribe</title>
    <meta
      name="description"
      content="Unique offline-first multimodal note-taking studio with interactive checklists, sketch canvas, voice transcripts, OCR extraction, version history, and intelligent Gemini AI summaries powered by your free Google AI Studio key."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta property="og:title" content="VellumScribe" />
    <meta
      property="og:description"
      content="Unique offline-first multimodal note-taking studio with interactive checklists, sketch canvas, voice transcripts, OCR extraction, version history, and intelligent Gemini AI summaries powered by your free Google AI Studio key."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VellumScribe — Minimalist Multimodal Notes Studio" />
    <meta
      name="twitter:description"
      content="Offline-first multimodal note-taking studio with interactive checklists, drawing canvas, voice transcriptions, OCR document scans, PIN security, and cloud sync."
    />
  </head>
  <body class="bg-[#121215] text-zinc-100">
    <div id="root">
      <!-- Instant Splash/Loading View displayed while SQLite WebAssembly & Keystore initializes -->
      <div
        id="vellumscribe-init-loader"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #121215;
          color: #e4e4e7;
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            Roboto,
            sans-serif;
          z-index: 99999;
        "
      >
        <!-- Brand mark at first paint: matches the launcher icon, favicon and
             Android splash (white V-quill on the near-black tile). -->
        <svg
          width="52"
          height="52"
          viewBox="0 0 100 100"
          fill="none"
          role="img"
          aria-label="VellumScribe"
          style="margin-bottom: 18px; display: block"
        >
          <rect width="100" height="100" rx="24" fill="#09090b" />
          <g transform="translate(14, 14) scale(3)">
            <path
              d="M4.5 4.5L12 19.5L19.5 4.5"
              stroke="#ffffff"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <path d="M12 19.5V11" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
            <circle cx="12" cy="8.5" r="1.75" fill="#ffffff" />
          </g>
        </svg>
        <div
          style="
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f4f4f5;
            margin-bottom: 6px;
          "
        >
          VellumScribe
        </div>
        <div style="font-size: 13px; color: #a1a1aa; letter-spacing: -0.01em">
          Loading your notes…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
