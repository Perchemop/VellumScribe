<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-label="VellumScribe — private, offline-first notes">
  <!--
    VellumScribe store-listing feature graphic (1024x500).
    Derived from assets/brand/vellumscribe-mark.svg. Original work, MIT.
    NOTE: rasterise to PNG (1024x500) before submitting to an app store;
    F-Droid/Play accept PNG/JPEG only for banners.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Brand mark, centred left -->
  <g transform="translate(150, 110) scale(2.8)">
    <rect width="100" height="100" rx="24" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <g transform="translate(14, 14) scale(3)">
      <path d="M4.5 4.5L12 19.5L19.5 4.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M12 19.5V11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="8.5" r="1.75" fill="#ffffff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="430" y="252" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">VellumScribe</text>
  <text x="434" y="308" fill="#a1a1aa" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="500">Private, offline-first notes</text>

  <!-- Hairline accent -->
  <rect x="434" y="336" width="180" height="3" rx="1.5" fill="#3f3f46"/>
</svg>
