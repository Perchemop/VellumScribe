<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="VellumScribe mark: a white V with a stem and dot on a near-black rounded square">
  <!--
    VellumScribe brand mark — original work, MIT (with the application).
    Canonical source for the logo. The web/app copy is generated from the same
    geometry into public/favicon.svg, and the Android launcher / splash rasters
    are generated by scripts/generate-brand-assets.mjs (npm run assets:brand).
    Geometry: V arms (4.5,4.5)->(12,19.5)->(19.5,4.5) stroke 2.5; stem
    (12,19.5)->(12,11) stroke 2; dot (12,8.5) r 1.75, all inside a
    100x100 viewBox with a 24px rounded near-black tile.
  -->
  <rect width="100" height="100" rx="24" fill="#09090b"/>
  <g transform="translate(14, 14) scale(3)">
    <path
      d="M4.5 4.5L12 19.5L19.5 4.5"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M12 19.5V11"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />
    <circle
      cx="12"
      cy="8.5"
      r="1.75"
      fill="#ffffff"
    />
  </g>
</svg>
