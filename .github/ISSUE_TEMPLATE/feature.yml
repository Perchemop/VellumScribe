name: Feature request
description: Propose a new capability or a change in behaviour
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. VellumScribe holds a narrow scope on purpose
        (`VISION.md`, `docs/scope.md`), so the most useful proposals explain
        the problem first and the feature second.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today, or what is frustrating? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to happen? Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, including doing nothing.
  - type: dropdown
    id: scope
    attributes:
      label: Does this fit the project vision?
      description: VellumScribe is a private, offline-first, local notes app. See `VISION.md`.
      options:
        - Yes — it makes the app more private / local / honest
        - Unsure — needs a maintainer's judgement
        - No — it is out of scope, but I want to record the request
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate
        - label: This is not a security report (those go to SECURITY.md, privately)
