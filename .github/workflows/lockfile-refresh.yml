name: Lockfile refresh (security fixes)

# npm cannot run on the maintainer's machine (guide §4: heavy work in Actions
# only), so this one-shot, manually dispatched job performs the lockfile-only
# dependency resolution that clears the open Dependabot alerts and commits the
# result. It exists because `npm audit fix` / `npm install` are banned locally.
#
# Usage: dispatch it, then review the pull request it opens. Delete this
# workflow once the alerts are clear — it is a remedy, not a standing gate.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the lockfile is being refreshed (recorded in the commit)'
        required: true
        default: 'Clear open Dependabot alerts (transitive dependency bumps)'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Resolve dependencies (lockfile only)
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          # `npm install` alone keeps a satisfied range pinned to whatever the
          # lock already resolved, so it never lifts a transitive dependency to
          # its patched version. `npm audit fix` is the targeted tool: it moves
          # exactly the packages with advisories, within the declared ranges,
          # and --package-lock-only keeps it from installing anything.
          npm audit fix --package-lock-only --legacy-peer-deps --no-fund
          echo '--- advisories remaining after the fix ---'
          npm audit --audit-level=low 2>&1 | tail -20 || true

      - name: Show what changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile change — nothing to fix."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- package-lock.json
            echo '### Resolved dependency changes' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff --unified=0 -- package-lock.json \
              | grep -E '^\+\s+"(version|resolved)"' | sort -u | head -60 \
              >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the refreshed lockfile still installs cleanly
        if: steps.diff.outputs.changed == 'true'
        run: npm ci --no-fund --no-audit

      - name: Audit result after the refresh
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm audit --audit-level=high --json > /tmp/audit.json 2>/dev/null || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/audit.json'))
          except Exception:
              print("audit output unreadable"); raise SystemExit(0)
          meta = d.get('metadata', {}).get('vulnerabilities', {})
          print("remaining vulnerabilities:", meta)
          PY

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          BRANCH="chore/lockfile-refresh-${{ github.run_id }}"
          git config user.name "VellumScribe Dev"
          git config user.email "dev@example.com"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile to clear Dependabot alerts

          $REASON

          Regenerated in GitHub Actions (npm is not run on the maintainer's
          machine); the job verified the result with a clean \`npm ci\` and
          recorded the remaining audit state in its summary."
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(deps): refresh lockfile to clear Dependabot alerts" \
            --body "$REASON

          Generated by the \`Lockfile refresh\` workflow (run ${{ github.run_id }}).
          The job ran \`npm install --package-lock-only\` with the same flags CI
          uses, verified the result with \`npm ci\`, and recorded the residual
          audit output in its run summary." \
            --base main --head "$BRANCH"
