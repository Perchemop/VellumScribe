name: Patch Settings Mode
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/patch_settings_mode.py
      - scripts/trigger-settings-patch
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_settings_mode.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/SettingsView.tsx
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "feat(settings): Simple/Advanced mode for casual vs power users"
          git push
