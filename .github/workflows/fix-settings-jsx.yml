name: Fix SettingsView JSX

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix_settings_view_jsx.py
      - .github/workflows/fix-settings-jsx.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_settings_view_jsx.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsView.tsx
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: SettingsView AI tab JSX + useEffect for SPA build"
            git push
          fi
