name: Patch OAuth Deep Link App
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/patch_oauth_deeplink_app.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_oauth_deeplink_app.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "feat(app): global OAuth deep-link listener for Android SSO return"
          git push
