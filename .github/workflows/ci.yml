name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify offline Whisper source gate files
      run: |
        set -euo pipefail
        ROOT="android/app/src/main/cpp/third_party/whisper.cpp"
        test -f android/app/src/main/cpp/CMakeLists.txt
        test -f android/app/src/main/cpp/jni_whisper.cpp
        test -f android/app/src/main/cpp/stub/whisper.cpp
        if [[ -f "$ROOT/src/whisper.cpp" && -f "$ROOT/ggml/src/ggml.c" ]]; then
          echo "WHISPER_UPSTREAM_PRESENT=true"
        else
          echo "WHISPER_UPSTREAM_PRESENT=false (stub-only until vendor-whisper workflow runs)"
        fi

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    # package-lock.json drifted from package.json (typescript-eslint nested versions).
    # Use install + legacy-peer-deps until lock is regenerated locally with:
    #   npm install --legacy-peer-deps
    - name: Install dependencies
      run: npm install --legacy-peer-deps --no-fund --no-audit

    - run: npm run typecheck
    - run: npm run lint
    - run: npm run check:orphans
    - run: npm run test
    - run: npm run build
