name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  # Format baseline established in slice B-3 (D-407, Q-004 resolved).
  # Required gate: `prettier --check .` must pass.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Prettier check
        run: npm run format:check

  build:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # All shell steps below are bash-only commands (`set -euo pipefail`,
    # `wc -c`, `[[ ]]`), so bash must be the shell on every runner —
    # Windows defaults to pwsh and macOS to bash, hence this override.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Guard against truncated storage.ts
        run: |
          set -euo pipefail
          SIZE=$(wc -c < src/lib/storage.ts)
          echo "storage.ts size=$SIZE"
          if [ "$SIZE" -lt 20000 ]; then
            echo "ERROR: src/lib/storage.ts looks truncated ($SIZE bytes)"
            exit 1
          fi
          grep -q 'export class StorageManager' src/lib/storage.ts
          grep -q 'getRecordingsForNote' src/lib/storage.ts

      - name: Verify offline Whisper source gate files
        run: |
          set -euo pipefail
          ROOT="android/app/src/main/cpp/third_party/whisper.cpp"
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f android/app/src/main/cpp/jni_whisper.cpp
          test -f android/app/src/main/cpp/stub/whisper.cpp
          if [[ -f "$ROOT/src/whisper.cpp" && -f "$ROOT/ggml/src/ggml.c" ]]; then
            echo "WHISPER_UPSTREAM_PRESENT=true"
          else
            echo "WHISPER_UPSTREAM_PRESENT=false"
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:orphans
      - run: npm run test
      - run: npm run build
