name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  restore-storage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch StorageManager if truncated
        run: |
          set -euo pipefail
          SIZE=$(wc -c < src/lib/storage.ts || echo 0)
          echo "storage.ts size=$SIZE"
          if [ "$SIZE" -lt 20000 ]; then
            echo "Restoring from cb3bd00d..."
            git show cb3bd00daffde8efb3399ee760caba8fb35456ce:src/lib/storage.ts > src/lib/storage.ts
          fi
          python3 << 'PY'
          from pathlib import Path
          path = Path('src/lib/storage.ts')
          t = path.read_text()
          assert len(t) > 20000, len(t)

          patches = [
          (
          """  public static bulkArchiveNotes(ids: number[]): void {
              for (const id of ids) this.archiveNote(id);
            }

            public static bulkDeleteNotes(ids: number[]): void {
              for (const id of ids) this.deleteNote(id);
            }""",
          """  public static bulkArchiveNotes(ids: number[]): number {
              let n = 0;
              for (const id of ids) {
                this.archiveNote(id);
                n++;
              }
              return n;
            }

            public static bulkDeleteNotes(ids: number[]): number {
              let n = 0;
              for (const id of ids) {
                this.deleteNote(id);
                n++;
              }
              return n;
            }""",
          ),
          (
          """  public static batchLockNotes(ids: number[], pin: string): number {
              let count = 0;
              for (const id of ids) {
                const n = this.getNoteById(id);
                if (!n || n.is_locked) continue;
                try {
                  // fire-and-forget sync path for batch
                  void this.setNotePinLock(id, pin);
                  count++;
                } catch {
                  /* skip */
                }
              }
              return count;
            }

            public static async batchUnlockNotes(ids: number[], pin: string): Promise<number> {
              let count = 0;
              for (const id of ids) {
                const n = this.getNoteById(id);
                if (!n || !n.is_locked) continue;
                const res = await this.verifyAndUnlockNote(n, pin);
                if (res.success) count++;
              }
              return count;
            }""",
          """  public static async batchLockNotes(ids: number[], pin: string): Promise<number> {
              let count = 0;
              for (const id of ids) {
                const n = this.getNoteById(id);
                if (!n || n.is_locked) continue;
                try {
                  const locked = await this.setNotePinLock(id, pin);
                  if (locked) count++;
                } catch {
                  /* skip */
                }
              }
              return count;
            }

            public static async batchUnlockNotes(
              ids: number[],
              pin: string
            ): Promise<{ unlockedCount: number }> {
              let unlockedCount = 0;
              for (const id of ids) {
                const n = this.getNoteById(id);
                if (!n || !n.is_locked) continue;
                const res = await this.verifyAndUnlockNote(n, pin);
                if (res.success) {
                  await this.removeNotePinLock(id, pin);
                  unlockedCount++;
                }
              }
              return { unlockedCount };
            }""",
          ),
          (
          """  public static saveUnlockedNote(
              noteId: number,
              payload: NotePayloadData,
              extras?: Partial<NoteRecord>
            ): NoteRecord | null {
              return this.updateNote(noteId, {
                title: payload.title,
                body: payload.body,
                checklist_items: payload.checklist_items || [],
                ...extras,
              });
            }""",
          """  public static async saveUnlockedNote(
              noteId: number,
              payload: NotePayloadData,
              pinOrExtras?: string | Partial<NoteRecord>
            ): Promise<NoteRecord | null> {
              const note = this.getNoteById(noteId);
              if (!note) return null;
              const pin = typeof pinOrExtras === 'string' ? pinOrExtras : undefined;
              const extras = typeof pinOrExtras === 'object' && pinOrExtras ? pinOrExtras : {};
              if (note.is_locked && pin && note.pin_salt) {
                try {
                  const encrypted_payload = await encryptNotePayload(
                    {
                      title: payload.title || '',
                      body: payload.body || '',
                      checklist_items: payload.checklist_items || [],
                    },
                    pin,
                    note.pin_salt
                  );
                  return this.updateNote(noteId, {
                    encrypted_payload,
                    title: note.lock_mode === 'private' ? '' : payload.title || note.title,
                    body: '',
                    checklist_items: [],
                    ...extras,
                  });
                } catch (e) {
                  AppLogger.warn('StorageManager', 'saveUnlockedNote encrypt failed', e);
                }
              }
              return this.updateNote(noteId, {
                title: payload.title,
                body: payload.body,
                checklist_items: payload.checklist_items || [],
                ...extras,
              });
            }""",
          ),
          (
          """  public static async cleanOrphanedMedia(): Promise<{ cleanedCount: number } | number> {
              try {
                if (typeof (SqliteRepository as any).cleanOrphanedMedia === 'function') {
                  const n = await (SqliteRepository as any).cleanOrphanedMedia();
                  return typeof n === 'number' ? { cleanedCount: n } : n;
                }
              } catch (e) {
                AppLogger.warn('StorageManager', 'cleanOrphanedMedia failed', e);
              }
              return { cleanedCount: 0 };
            }""",
          """  public static async cleanOrphanedMedia(): Promise<{ cleanedCount: number }> {
              try {
                if (typeof (SqliteRepository as any).cleanOrphanedMedia === 'function') {
                  const n = await (SqliteRepository as any).cleanOrphanedMedia();
                  const count = typeof n === 'number' ? n : (n?.cleanedCount ?? 0);
                  return { cleanedCount: count };
                }
              } catch (e) {
                AppLogger.warn('StorageManager', 'cleanOrphanedMedia failed', e);
              }
              return { cleanedCount: 0 };
            }""",
          ),
          (
          """  public static exportNotesAsJson(): string {
              return JSON.stringify(this.getNotes(), null, 2);
            }

            public static exportNotesAsMarkdown(): string {
              return this.getNotes()
                .map((n) => `# ${n.title || 'Untitled'}\\n\\n${n.body || ''}`)
                .join('\\n\\n---\\n\\n');
            }""",
          """  public static exportNotesAsJson(ids?: number[]): string {
              let notes = this.getNotes();
              if (ids && ids.length) notes = notes.filter((n) => ids.includes(n.id));
              return JSON.stringify(notes, null, 2);
            }

            public static exportNotesAsMarkdown(ids?: number[]): string {
              let notes = this.getNotes();
              if (ids && ids.length) notes = notes.filter((n) => ids.includes(n.id));
              return notes
                .map((n) => `# ${n.title || 'Untitled'}\\n\\n${n.body || ''}`)
                .join('\\n\\n---\\n\\n');
            }""",
          ),
          (
          "title: `${src.title || 'Untitled'} (copy)`",
          "title: `${src.title || 'Untitled'} (Copy)`",
          ),
          ]

          for old, new in patches:
              if old in t:
                  t = t.replace(old, new, 1)
                  print('applied patch')
              else:
                  print('skip missing pattern', old[:60].replace('\\n',' '))

          path.write_text(t)
          print('final size', path.stat().st_size)
          assert 'getRecordingsForNote' in t
          assert 'unlockedCount' in t or 'batchUnlockNotes' in t
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storage.ts
          if git diff --staged --quiet; then
            echo "No storage changes"
          else
            git commit -m "fix(storage): restore full API + align batch/export/saveUnlocked signatures"
            git push
          fi

  build:
    runs-on: ubuntu-latest
    needs: [restore-storage]
    if: always()
    steps:
    - uses: actions/checkout@v4

    - name: Verify offline Whisper source gate files
      run: |
        set -euo pipefail
        ROOT="android/app/src/main/cpp/third_party/whisper.cpp"
        test -f android/app/src/main/cpp/CMakeLists.txt
        test -f android/app/src/main/cpp/jni_whisper.cpp
        test -f android/app/src/main/cpp/stub/whisper.cpp
        if [[ -f "$ROOT/src/whisper.cpp" && -f "$ROOT/ggml/src/ggml.c" ]]; then
          echo "WHISPER_UPSTREAM_PRESENT=true"
        else
          echo "WHISPER_UPSTREAM_PRESENT=false"
        fi

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --no-fund --no-audit

    - run: npm run typecheck
    - run: npm run lint
    - run: npm run check:orphans
    - run: npm run test
    - run: npm run build
