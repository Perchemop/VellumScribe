name: Build Android APK

# The run title always states which variant it produces, so nobody has to open
# a run to discover whether it contains the native-engine or stub APK.
run-name: >-
  Android APK — ${{
    github.event_name == 'workflow_dispatch' && inputs.whisper_mode
    || (startsWith(github.ref, 'refs/tags/') && 'real + stub (release)' || 'real (native engine)')
  }}

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      whisper_mode:
        description: 'Native Whisper build mode'
        required: true
        default: 'real'
        type: choice
        options:
          - real
          - stub

# Tagged releases attach both APK variants to a GitHub Release, which needs
# write access to repository contents (the default token is read-only here).
permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    # Tagged releases build BOTH variants so the GitHub Release always carries
    # a native-engine APK and a stub APK side by side (client request: "there
    # is still no stub in github actions" — the variant was only visible
    # inside the artifact name, and push builds produced real only).
    name: Build & Package Android APK (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.whisper_mode)) || (startsWith(github.ref, 'refs/tags/') && fromJSON('["real", "stub"]') || fromJSON('["real"]')) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Whisper upstream tree (src + ggml)
        run: |
          set -euo pipefail
          ROOT="android/app/src/main/cpp/third_party/whisper.cpp"
          if [[ ! -f "$ROOT/src/whisper.cpp" || ! -f "$ROOT/ggml/src/ggml.c" ]]; then
            bash scripts/setup-whisper-third-party.sh
          fi
          test -f "$ROOT/src/whisper.cpp"
          test -f "$ROOT/include/whisper.h"
          test -f "$ROOT/ggml/src/ggml.c"
          echo "WHISPER_TREE_OK"

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK packages (no obsolete tools package)
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [[ -z "${ANDROID_HOME:-}" && -d /usr/local/lib/android/sdk ]]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          SM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [[ -z "$SM" || ! -x "$SM" ]]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME="$HOME/android-sdk"
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses >/tmp/sdk-licenses.txt || true
          "$SM" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build Web Application
        run: npm run build:spa

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Bundle Whisper Tiny model into APK assets
        if: ${{ matrix.mode == 'real' }}
        run: |
          set -euo pipefail
          DEST="android/app/src/main/assets/models/whisper"
          mkdir -p "$DEST"
          URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin"
          echo "Downloading Whisper Tiny (~30MB) into APK assets…"
          curl -fsSL -L --retry 5 --retry-delay 3 -o "$DEST/ggml-tiny-q5_1.bin" "$URL"
          # Must match ModelManager.VERIFIED_MODELS whisper-tiny expectedSha256
          EXPECTED="818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7"
          ACTUAL=$(sha256sum "$DEST/ggml-tiny-q5_1.bin" | awk '{print $1}')
          echo "sha256=$ACTUAL size=$(stat -c%s "$DEST/ggml-tiny-q5_1.bin")"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: bundled model checksum mismatch"
            echo "expected $EXPECTED"
            echo "got      $ACTUAL"
            exit 1
          fi
          ls -lh "$DEST/ggml-tiny-q5_1.bin"
          echo "BUNDLED_WHISPER_TINY_OK"

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Configure Whisper STUB vs REAL
        id: whisper
        run: |
          MODE="${{ matrix.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Apply STUB CMake flag when requested
        if: ${{ matrix.mode == 'stub' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text()
          needle = 'arguments "-DANDROID_STL=c++_shared"'
          repl = 'arguments "-DANDROID_STL=c++_shared", "-DVELLUM_WHISPER_REAL=OFF"'
          if needle in text:
              p.write_text(text.replace(needle, repl, 1))
              print("Injected VELLUM_WHISPER_REAL=OFF")
          else:
              print("WARNING: cmake arguments line not found")
          PY

      # NOTE: the `secrets` context is not available inside `if:`, so the
      # presence check is done in the shell instead (env carries the secret).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; the release APK will be UNSIGNED."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vellumscribe-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/vellumscribe-release.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          echo "Release signing configured from secrets."

      - name: Require signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Tagged releases must be signed with the stable release keystore, otherwise the APK cannot replace an already-installed copy. Set the ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "Signing secret present; tagged release will be signed."

      - name: Build Android APKs (Debug + Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VellumScribe-Android-APKs-${{ steps.whisper.outputs.mode }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload ProGuard mapping files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VellumScribe-ProGuard-Mappings-${{ steps.whisper.outputs.mode }}
          path: |
            android/app/build/outputs/mapping/release/*.txt
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      # II.29.6: the published surface includes build artefacts. A release is
      # blocked until the *assembled* APK (not just the source tree) is clean:
      # an artefact can embed a build machine's absolute paths.
      - name: Scan built artefacts for personal data (guide §II.29.6)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset-scan"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            unzip -q -o "$apk" -d "$RUNNER_TEMP/asset-scan/$name"
          done
          node scripts/check-personal-data.mjs "$RUNNER_TEMP/asset-scan"

      - name: Stage named release files (per mode + checksums)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          MODE="${{ matrix.mode }}"
          VER="${GITHUB_REF_NAME#v}"
          STAGE="${RUNNER_TEMP}/release-stage"
          mkdir -p "$STAGE"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            cp "$apk" "${STAGE}/VellumScribe-v${VER}-${MODE}-release.apk"
          done
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            cp "$apk" "${STAGE}/VellumScribe-v${VER}-${MODE}-debug.apk"
          done
          cd android/app/build/outputs/apk
          sha256sum release/*.apk > "${STAGE}/VellumScribe-v${VER}-${MODE}-SHA256SUMS.txt"
          ls -lh "$STAGE"

      - name: Release APK (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/release-stage/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
