name: Patch Remaining Audit Items
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/patch_diagnostics_tools.py
      - scripts/patch_gemini_consent.py
      - scripts/patch_sketch_media_key.py
      - src/components/settings/DiagnosticsTools.tsx
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python3 scripts/patch_diagnostics_tools.py
          python3 scripts/patch_gemini_consent.py
          python3 scripts/patch_sketch_media_key.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/SettingsView.tsx src/lib/geminiService.ts src/components/NoteEditorWriteFirst.tsx || true
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "feat: wire diagnostics tools, Gemini consent, sketch media-key"
          git push
