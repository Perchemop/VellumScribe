name: Format patch (diagnostic)

# TEMPORARY. npm and npx are banned on the maintainer's machine, so the only
# way to learn what Prettier wants for a hand-written file is to let CI run it
# and print the diff. This workflow exists only to produce that diff; it is
# deleted as soon as the files are fixed and never merged.
on:
  push:
    branches: [verify/visual]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Apply Prettier
        run: npx prettier --write .

      - name: Show the diff
        run: |
          git --no-pager diff --stat
          echo '===== DIFF START ====='
          git --no-pager diff
          echo '===== DIFF END ====='

      - name: Upload patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: format-patch
          path: |
            ./*.patch
          if-no-files-found: ignore
          retention-days: 3
