name: Restore Core

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-core.yml

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore storage.ts and patch boot retry
        run: |
          set -euo pipefail
          git show b5cbe3ea23f7d122eee654a3e71da656590897f9:src/lib/storage.ts > src/lib/storage.ts
          python3 << 'PY'
          from pathlib import Path
          path = Path('src/lib/storage.ts')
          t = path.read_text()
          old = """      } catch (err: any) {
        AppLogger.error('StorageManager', 'Initialization failed', err);
        throw err;
      }"""
          new = """      } catch (err: any) {
        AppLogger.error('StorageManager', 'Initialization failed', err);
        this.initPromise = null;
        this.isInitialized = false;
        throw err;
      }"""
          if old not in t:
              raise SystemExit('storage.ts pattern not found')
          path.write_text(t.replace(old, new, 1))
          assert 'StorageManager' in t
          print('storage restored', path.stat().st_size)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storage.ts
          git commit -m "fix(boot): restore storage.ts with init retry after failure" || exit 0
          git push
