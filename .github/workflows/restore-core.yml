name: Restore Core

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-core.yml
      - src/lib/storage.ts

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full storage.ts if truncated
        run: |
          set -euo pipefail
          SIZE=$(wc -c < src/lib/storage.ts || echo 0)
          echo "current storage.ts size=$SIZE"
          if [ "$SIZE" -lt 20000 ]; then
            echo "Restoring full StorageManager from b5cbe3ea..."
            git show b5cbe3ea23f7d122eee654a3e71da656590897f9:src/lib/storage.ts > src/lib/storage.ts
            python3 << 'PY'
          from pathlib import Path
          path = Path('src/lib/storage.ts')
          t = path.read_text()
          old = """      } catch (err: any) {
        AppLogger.error('StorageManager', 'Initialization failed', err);
        throw err;
      }"""
          new = """      } catch (err: any) {
        AppLogger.error('StorageManager', 'Initialization failed', err);
        this.initPromise = null;
        this.isInitialized = false;
        throw err;
      }"""
          if old in t:
              t = t.replace(old, new, 1)
              path.write_text(t)
              print('patched initPromise retry')
          else:
              print('initPromise pattern already present or different')
          print('restored size', path.stat().st_size)
          assert path.stat().st_size > 50000
          assert 'verifyAndUnlockNote' in path.read_text()
          assert 'getSqliteStats' in path.read_text()
          assert 'batchTrashNotes' in path.read_text()
          PY
          else
            echo "storage.ts already full-sized; no restore needed"
          fi

      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storage.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(storage): restore full StorageManager API from b5cbe3ea + init retry"
            git push
          fi
