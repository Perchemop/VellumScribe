name: UX Pass 3

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ux_pass3.py
      - .github/workflows/ux-pass3.yml
      - src/components/settings/OfflineAiPanel.tsx

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ux_pass3.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ux: simple mode AI/Storage tabs, remove offline-ai subtab, slim OfflineAiPanel"
            git push
          fi
