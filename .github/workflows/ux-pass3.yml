name: UX Pass 3 Cloud Copy

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ux_pass3_cloud_copy.py
      - .github/workflows/ux-pass3.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ux_pass3_cloud_copy.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ux: shorten cloud provider and sync copy"
            git push
          fi
