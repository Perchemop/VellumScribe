name: Restore App CloudSync
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/restore-payloads/**
      - .github/workflows/restore-app-cloudsync.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads into source
        run: |
          python3 - <<'PY'
          import base64, pathlib
          app = pathlib.Path('scripts/restore-payloads/App.tsx.b64').read_text().strip()
          cs = pathlib.Path('scripts/restore-payloads/cloudSync.ts.b64').read_text().strip()
          pathlib.Path('src/App.tsx').write_bytes(base64.b64decode(app))
          pathlib.Path('src/lib/cloudSync.ts').write_bytes(base64.b64decode(cs))
          assert b'export default function App' in pathlib.Path('src/App.tsx').read_bytes()
          assert b'consecutiveFailures' in pathlib.Path('src/lib/cloudSync.ts').read_bytes()
          print('restored', pathlib.Path('src/App.tsx').stat().st_size, pathlib.Path('src/lib/cloudSync.ts').stat().st_size)
          PY
      - name: Commit restored sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/lib/cloudSync.ts
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "fix: restore App.tsx and cloudSync.ts (backlog P/U)"
          git push
