name: Restore From Good Commits
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-from-good-commits.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App.tsx from last good rewrite
        run: |
          git show 77eff17814857e80c358678f4a478a986fbbf020:src/App.tsx > src/App.tsx
          # Fix SettingsView props
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/App.tsx').read_text()
          old = "<SettingsView activeSubtab={settingsSubtab} onSubtabChange={setSettingsSubtab} />"
          new = """<SettingsView
                initialSubtab={settingsSubtab}
                onRefreshNotes={refreshData}
                onBackToNotes={() => setActiveView('notes')}
              />"""
          if old in t:
              t = t.replace(old, new, 1)
              Path('src/App.tsx').write_text(t)
              print('App SettingsView props fixed')
          else:
              print('App SettingsView pattern already updated or different')
          assert 'export default function App' in t
          assert 'ListDensityProvider' in t
          assert 'md:hidden' in t
          print('App OK', len(t))
          PY

      - name: Restore cloudSync and apply backoff
        run: |
          git show 10874f76efa1618c1672051758c42b6e27b9765e:src/lib/cloudSync.ts > src/lib/cloudSync.ts
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/lib/cloudSync.ts').read_text()
          if 'consecutiveFailures' in t:
              print('backoff already present')
          else:
              old = """    try {
      // Process items sequentially
      for (const item of [...queue]) {
        try {"""
              new = """    try {
      // Process items sequentially with exponential backoff after failures
      let consecutiveFailures = 0;
      for (const item of [...queue]) {
        if (consecutiveFailures > 0) {
          const delayMs = Math.min(30000, 1000 * Math.pow(2, consecutiveFailures - 1));
          await new Promise((r) => setTimeout(r, delayMs));
        }
        try {"""
              if old not in t:
                  raise SystemExit('cloudSync marker missing')
              t = t.replace(old, new, 1)
              t = t.replace(
                  """          if (success) {
            successCount++;
            this.removeFromSyncQueue(item.id);
          } else {
            failedCount++;
            item.attempts++;
            item.lastError = 'Sync failed during queue execution';
            SyncRepository.markFailed(item.id, item.lastError).catch(() => {});
          }
        } catch (e: any) {
          failedCount++;
          item.attempts++;
          const errorMsg = e?.message || 'Network exception';
          item.lastError = errorMsg;
          SyncRepository.markFailed(item.id, errorMsg).catch(() => {});
          break; // Stop further queue attempts if network error occurs
        }""",
                  """          if (success) {
            successCount++;
            consecutiveFailures = 0;
            this.removeFromSyncQueue(item.id);
          } else {
            failedCount++;
            consecutiveFailures++;
            item.attempts++;
            item.lastError = 'Sync failed during queue execution';
            SyncRepository.markFailed(item.id, item.lastError).catch(() => {});
            if (consecutiveFailures >= 3) break;
          }
        } catch (e: any) {
          failedCount++;
          consecutiveFailures++;
          item.attempts++;
          const errorMsg = e?.message || 'Network exception';
          item.lastError = errorMsg;
          SyncRepository.markFailed(item.id, errorMsg).catch(() => {});
          if (consecutiveFailures >= 3) break;
        }",
                  1,
              )
              Path('src/lib/cloudSync.ts').write_text(t)
              print('backoff applied')
          assert 'export class CloudSyncEngine' in Path('src/lib/cloudSync.ts').read_text()
          PY

      - name: Fix SettingsView corruption from passphrase inject
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/SettingsView.tsx')
          t = p.read_text()
          # Remove broken useEffect that starts with JSX BackupPassphrase
          t2 = re.sub(
              r"React\.useEffect\(\(\) => \{\s*<BackupPassphra[\s\S]*?\}, \[[^\]]*\]\);",
              "",
              t,
              count=1,
          )
          if t2 == t:
              # broader: from React.useEffect with BackupPassphra until next solid method
              t2 = re.sub(
                  r"\n  React\.useEffect\(\(\) => \{\s*<BackupPassphra[\s\S]*?\n  (const handle|function |// )",
                  r"\n  \1",
                  t,
                  count=1,
              )
          # Ensure import
          if 'BackupPassphrasePanel' not in t2.split('export const')[0] and "from './settings/BackupPassphrasePanel'" not in t2:
              t2 = t2.replace(
                  "import { OfflineAiPanel } from './settings/OfflineAiPanel'",
                  "import { OfflineAiPanel } from './settings/OfflineAiPanel';\nimport { BackupPassphrasePanel } from './settings/BackupPassphrasePanel';\nimport { CloudSettingsPanel } from './settings/CloudSettingsPanel';",
              )
          # Ensure panel rendered once in cloud tab if not present
          if '<CloudSettingsPanel' not in t2 and "activeTab === 'cloud'" in t2:
              t2 = t2.replace(
                  "{activeTab === 'cloud' && (",
                  "{activeTab === 'cloud' && (\n        <>\n        <CloudSettingsPanel />",
                  1,
              )
              # may need closing fragment - only if we opened one
              if '<>\n        <CloudSettingsPanel' in t2 and t2.count('<>') > t2.count('</>'):
                  # try close before matching )}
                  pass
          p.write_text(t2)
          # syntax sanity: no BackupPassphra mid-useEffect
          assert '<BackupPassphra' not in p.read_text() or 'BackupPassphrasePanel' in p.read_text()
          print('SettingsView sanitized', p.stat().st_size)
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/lib/cloudSync.ts src/components/SettingsView.tsx
          git status
          git diff --cached --stat
          git commit -m "fix: restore App/cloudSync/SettingsView and apply P-03/P-04/U-01/U-03" || exit 0
          git push
