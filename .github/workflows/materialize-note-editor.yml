name: Materialize NoteEditorImpl
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/note-editor-impl.b64.gz'
      - 'scripts/materialize-note-editor.sh'
      - '.github/workflows/materialize-note-editor.yml'
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode NoteEditorImpl
        run: bash scripts/materialize-note-editor.sh
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/NoteEditorImpl.tsx
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: materialize NoteEditorImpl (write-first chrome)'
            git push
          fi
