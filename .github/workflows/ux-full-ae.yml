name: UX Full A-E Pass

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ux_full_ae_pass.py
      - name: Commit (no workflow file changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD -- .github/workflows || true
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ux: apply remaining A-E source patches"
            git push
          fi
