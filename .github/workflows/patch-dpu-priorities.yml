name: Patch DPU Priorities
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/patch_dpu_priorities.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_dpu_priorities.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "fix: apply D/P/U priority patches (backoff, passphrase, App settings)"
          git push
