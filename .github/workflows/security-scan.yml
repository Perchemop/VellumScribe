name: Security Scanning

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 4 * * 1'

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # Code scanning is not enabled on this repository, so GitHub rejects the
      # SARIF upload and fails the step ("Code scanning is not enabled...").
      # Keep the analysis running but don't let that config gap fail the run;
      # a summary step below surfaces it loudly instead of swallowing it silently.
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Explain unrecorded results (code scanning disabled)
        if: always() && steps.analyze.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ CodeQL ran, but code scanning is not enabled — results NOT recorded
          This repository has **code scanning disabled**, so GitHub rejected the SARIF upload. The analysis itself ran; no findings can be recorded or displayed until it is enabled.
          **Repository admin:** enable it under **Settings → Code security and analysis → Code scanning** (Default setup), after which this workflow's results will be recorded again.
          EOF

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Run dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  dependency-review:
    name: dependency review
    # Reviews the dependency changes a PR introduces against the GitHub
    # Advisory Database (guide §20.3, §20.7). PRs only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan the commits in this push/PR.
          fetch-depth: 0

      # gitleaks fails the job if it finds a secret in the diff (guide §20.1).
      # Free for personal-account repositories (a licence is not required).
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-scan:
    name: licence scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # Fails on strong-copyleft, source-available, non-commercial or
      # unlicensed dependencies (guide §19.2, §19.4).
      - name: Check dependency licences
        run: node scripts/check-licenses.mjs

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # CycloneDX SBOM: every component, version and licence (guide §19.4).
      - name: Generate CycloneDX SBOM
        # --ignore-npm-errors: the tree is installed with --legacy-peer-deps,
        # so `npm ls` reports peer-range conflicts (e.g. via typescript-eslint's
        # eslint peer). That is expected here and must not fail SBOM generation.
        run: npx --yes @cyclonedx/cyclonedx-npm@^6 --ignore-npm-errors --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error
